# Visor on piano (Xiaomi Pad 8 Pro). Volume keys move, power selects.
#
# No entry { } blocks here: Visor then finds installed systems itself
# (UKIs in \EFI\Linux, kernels in /boot, Windows Boot Manager) and reads
# Boot Loader Spec entries from \loader\entries, where the shell lives.
# Seconds before the selected entry starts; -1 waits, 0 starts at once.
timeout=30

# Wallpaper: each one is a theme in \EFI\visor\themes. Set a name, or
# random / cycle to change it every boot. make-esp.sh sets the first one.
theme=default

# Look: wallpaper, square frosted selection, icons centred, power icons
# bottom left.
title=none
logo=none
blur=1
icon_size=96
icon_spacing=72
name_size=18
power_position=bottomleft
power_icons=1
power_icon_size=36
shutdown_icon=\EFI\visor\icons\power_shutdown.png
reboot_icon=\EFI\visor\icons\power_reboot.png
firmware_icon=\EFI\visor\icons\power_bios.png
anim_speed=10

# Underline and power icons take their colors from the wallpaper.
accent=1
accent_variant=tonal
