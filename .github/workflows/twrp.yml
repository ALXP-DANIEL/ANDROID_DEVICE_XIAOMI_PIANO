name: TWRP 16 Builder (piano)

# Xiaomi Pad 8 Pro (piano) TWRP16 recovery build.
#
# Adapted from the sm8750_thales workflow, with two differences that matter for
# this device:
#
#   1. piano's bootloader refuses any recovery whose compressed ramdisk exceeds
#      a measured bound of ~29.21 MB. The build is therefore gated on size and
#      FAILS rather than publishing an unbootable image.
#   2. ALLOW_MISSING_DEPENDENCIES lets Soong skip modules whose dependencies are
#      absent, which can silently drop something the recovery needs. An ELF
#      closure audit of the produced ramdisk gates that.
#
# Both gates run before any artifact is uploaded.

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path under device/"
        required: true
        default: "xiaomi/piano"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "piano"
      LUNCH_TARGET:
        description: "Full lunch target"
        required: true
        default: "twrp_piano-bp2a-eng"
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # Checked out AFTER maximize-build-space: that action remounts the
      # workspace onto a new filesystem and discards anything already there,
      # which is why an earlier checkout vanished before "Install device tree".
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device_tree
          ref: twrp-16

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          max-size: 5G

      # A GitHub runner has 16 GB of RAM. Soong's analysis phase for a full
      # AOSP 16 tree peaked at 15.4 GB when measured on the local builder, so
      # zram is not optional here - without it the runner OOM-kills soong_build
      # exactly as the 15 GB VM did.
      - name: Setup zram
        run: |
          # linux-modules-extra is only installed if zram is not already
          # available. Installing it regenerates an initramfs on a root
          # filesystem that maximize-build-space has already shrunk, and that
          # has filled the disk mid-step:
          #   cp: error copying '/lib/x86_64-linux-gnu/libcrypto.so.3' ...
          #       No space left on device
          # On current runners zram is a built-in module and the package is
          # unnecessary.
          df -h /
          sudo apt-get install -y --no-install-recommends zram-tools
          if ! sudo modprobe zram; then
            sudo apt-get install -y --no-install-recommends \
              linux-modules-extra-$(uname -r)
            sudo modprobe zram
          fi
          sudo sed -i 's/^#\?PERCENT=.*/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#\?PRIORITY=.*/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl
          free -h

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y repo lz4 cpio python3
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Sync source
        run: |
          repo init -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }} --depth=1
          (while true; do echo "$(date +%T) syncing..."; sleep 60; done) &
          TIP=$!
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          kill $TIP || true

      - name: Install device tree
        run: |
          mkdir -p device/${{ inputs.DEVICE_PATH }}
          rsync -a --exclude '.git' --exclude '.github' \
            "$GITHUB_WORKSPACE/device_tree/" "device/${{ inputs.DEVICE_PATH }}/"
          # The checkout sits inside the build root, so kati would parse its
          # Android.mk a second time and fail with
          #   error: device_tree: MODULE.TARGET.EXECUTABLES.piano_qseecomd
          #          already defined by device/xiaomi/piano
          rm -rf "$GITHUB_WORKSPACE/device_tree"
          ls -la device/${{ inputs.DEVICE_PATH }}

      - name: Check audit script syntax
        run: python3 -m py_compile device/${{ inputs.DEVICE_PATH }}/tools/piano16-elf-closure-audit.py

      # CI proves that the source builds. The tested release image was signed
      # locally; its private AVB key never enters GitHub Actions.
      - name: Generate disposable CI AVB key
        run: |
          set -euo pipefail
          umask 077
          KEY=device/${{ inputs.DEVICE_PATH }}/security/recovery_avb.pem
          mkdir -p "$(dirname "$KEY")"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$KEY" >/dev/null 2>&1
          test -s "$KEY"

      - name: Apply tested recovery and crypto patches
        run: |
          set -euo pipefail
          DEVICE=device/${{ inputs.DEVICE_PATH }}
          # The recovery branch has advanced since the image validated on the
          # tablet. Build from the exact source revision used for that image.
          git -C bootable/recovery fetch --depth=1 https://github.com/TWRP-Test/android_bootable_recovery.git 580a0e89cb27007f4584cbb9649ba2607bb21d6a
          git -C bootable/recovery checkout --detach 580a0e89cb27007f4584cbb9649ba2607bb21d6a
          for patch in "$DEVICE"/patches/bootable_recovery/*.patch; do
            git -C bootable/recovery apply --check "$GITHUB_WORKSPACE/$patch"
            git -C bootable/recovery apply "$GITHUB_WORKSPACE/$patch"
          done
          git -C system/vold apply --check "$GITHUB_WORKSPACE/$DEVICE/patches/system_vold/0001-recovery-crypto-safety-invariants.patch"
          git -C system/vold apply "$GITHUB_WORKSPACE/$DEVICE/patches/system_vold/0001-recovery-crypto-safety-invariants.patch"
          git -C system/security apply --check "$GITHUB_WORKSPACE/$DEVICE/patches/system_security/0001-recovery-keymint-mutation-policy.patch"
          git -C system/security apply "$GITHUB_WORKSPACE/$DEVICE/patches/system_security/0001-recovery-keymint-mutation-policy.patch"
          git -C vendor/twrp apply --check "$GITHUB_WORKSPACE/$DEVICE/patches/vendor_twrp/0001-export-crypto-flags-to-soong.patch"
          git -C vendor/twrp apply "$GITHUB_WORKSPACE/$DEVICE/patches/vendor_twrp/0001-export-crypto-flags-to-soong.patch"

      - name: Add QTI boot control
        run: |
          set -euo pipefail
          # The recovery needs a Boot Control HAL to install A/B zips. Without
          # this checkout, ALLOW_MISSING_DEPENDENCIES dropped the module silently
          # and every install failed with "AIDL IBootControl not available".
          rm -rf hardware/qcom/bootctrl
          git clone --depth=1 -b lineage-23.2-caf https://github.com/LineageOS/android_hardware_qcom_bootctrl.git hardware/qcom/bootctrl
          git -C hardware/qcom/bootctrl apply "$GITHUB_WORKSPACE/device/${{ inputs.DEVICE_PATH }}/patches/hardware_qcom_bootctrl/0001-drop-generated-kernel-headers.patch"

      - name: Build recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export CCACHE_EXEC=$(command -v ccache)
          export USE_CCACHE=1
          export CCACHE_MAXSIZE=5G
          # ckati overflows the default 8 MB stack on a tree this size.
          ulimit -s unlimited
          lunch ${{ inputs.LUNCH_TARGET }}
          (while true; do echo "$(date +%T) building..."; free -h | sed -n 2p; sleep 30; done) &
          TIP=$!
          m ${{ inputs.BUILD_PARTITION }}image -j$(nproc)
          kill $TIP || true

      # ---- gates ----------------------------------------------------------
      # Nothing is published unless both pass.

      - name: Gate - image invariants and size budget
        run: |
          IMG=out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_PARTITION }}.img
          bash device/${{ inputs.DEVICE_PATH }}/tools/piano16-preflash-audit.sh "$IMG"

      - name: Gate - ELF closure
        run: |
          IMG=out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_PARTITION }}.img
          python3 device/${{ inputs.DEVICE_PATH }}/tools/piano16-elf-closure-audit.py "$IMG"

      - name: Record image identity
        run: |
          IMG=out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_PARTITION }}.img
          mkdir -p artifacts
          cp "$IMG" "artifacts/recovery-${{ inputs.DEVICE_NAME }}-$(date +%Y%m%d-%H%M%S).img"
          (cd artifacts && sha256sum *.img | tee SHA256SUMS)
          printf '%s\n' 'CI build signed with a disposable key; this is not the tested TWRP release image.' > artifacts/CI_BUILD_NOTICE.txt

      # Uploaded as a workflow artifact, not a public release. The ramdisk
      # contains proprietary Xiaomi touch firmware, TFLite models and vendor
      # libraries whose redistribution rights have not been established.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ inputs.DEVICE_NAME }}-ci-testkey
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Remove disposable CI AVB key
        if: always()
        run: rm -f device/${{ inputs.DEVICE_PATH }}/security/recovery_avb.pem
