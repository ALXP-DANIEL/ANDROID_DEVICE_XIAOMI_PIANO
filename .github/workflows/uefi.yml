name: UEFI Builder (piano)

# Xiaomi Pad 8 Pro (piano) UEFI: the Mu-Silicium firmware, the selector
# that runs before the kernel, and an ESP with the Visor boot manager, as
# recovery ZIPs that install it into any ROM's boot image. The sources are
# on the uefi branch; see its README.
#
# Run it from the Actions tab. The look is picked here: a wallpaper link,
# files from tools/esp/wallpapers on the uefi branch, or none for Visor's own.

on:
  workflow_dispatch:
    inputs:
      WALLPAPER_URL:
        description: "Wallpaper image link (optional; becomes the default)"
        required: false
        default: ""
      WALLPAPER:
        description: "Wallpapers from tools/esp/wallpapers: all, none, or file names separated by spaces"
        required: true
        default: "all"
      ACCENT:
        description: "Colors taken from the wallpaper (off = fixed blue)"
        type: choice
        required: true
        default: "tonal"
        options: [tonal, neutral, content, fidelity, vibrant, expressive, monochrome, "off"]
      TIMEOUT:
        description: "Seconds before Visor starts the selected entry (-1 = wait, 0 = at once)"
        required: true
        default: "30"
      DEFAULT:
        description: "Entry selected when Visor opens (its title, e.g. Android or Arch Linux)"
        required: true
        default: "Android"
      QUIET:
        description: "Keep the chosen entry's icon on black while it starts, no boot log"
        type: boolean
        default: true
      REF:
        description: "Branch to build"
        required: true
        default: "uefi"

jobs:
  build:
    # arm64, like the Apple silicon hosts this is built on: Visor builds
    # against the host's libc headers.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.REF }}

      - name: Set up Mu-Silicium
        run: tools/setup-deps.sh

      - name: Build the UEFI firmware
        run: |
          docker build -f docker/Dockerfile -t piano-uefi-build .
          # The checkout belongs to the runner user, not the container's root.
          docker run --rm -v "$PWD:/p" -w /p/deps/Mu-Silicium piano-uefi-build sh -c \
            "git config --global --add safe.directory '*' && python3 build_uefi.py -d piano -r RELEASE"

      - name: Build the selector
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm imagemagick
          make -C selector LLVM=/usr/bin LLD=/usr/bin

      - name: Build the ESP
        env:
          WALLPAPER_URL: ${{ inputs.WALLPAPER_URL }}
          WALLPAPER: ${{ inputs.WALLPAPER }}
          ACCENT: ${{ inputs.ACCENT }}
          TIMEOUT: ${{ inputs.TIMEOUT }}
          DEFAULT: ${{ inputs.DEFAULT }}
          QUIET: ${{ inputs.QUIET }}
        run: |
          case $TIMEOUT in -1|[0-9]|[0-9][0-9]|[0-9][0-9][0-9]) ;; *) echo "bad TIMEOUT: $TIMEOUT"; exit 1 ;; esac
          case $DEFAULT in *[!A-Za-z0-9\ ._-]*|"") echo "bad DEFAULT: $DEFAULT"; exit 1 ;; esac
          set --
          case $WALLPAPER in
          all) for f in tools/esp/wallpapers/*; do
                 case $f in *.md) ;; *) [ -f "$f" ] && set -- "$@" "$f" ;; esac
               done ;;
          none|"") ;;
          *) for f in $WALLPAPER; do
               [ -f "tools/esp/wallpapers/$f" ] || { echo "no tools/esp/wallpapers/$f"; exit 1; }
               set -- "$@" "tools/esp/wallpapers/$f"
             done ;;
          esac
          if [ -n "$WALLPAPER_URL" ]; then
            mkdir -p /tmp/wallpaper
            curl -fsSL -o /tmp/wallpaper/custom "$WALLPAPER_URL"
            set -- /tmp/wallpaper/custom "$@"
          fi
          sudo chown -R "$USER" deps
          tools/esp/make-esp.sh out/esp "$@"
          conf=out/esp/EFI/visor/boot.conf
          if [ "$ACCENT" = off ]; then
            sed -i 's/^accent=.*/accent=0/' "$conf"
          else
            sed -i "s/^accent_variant=.*/accent_variant=$ACCENT/" "$conf"
          fi
          sed -i "s/^timeout=.*/timeout=$TIMEOUT/" "$conf"
          sed -i "s/^default=.*/default=$DEFAULT/" "$conf"
          sed -i "s/^quiet=.*/quiet=$([ "$QUIET" = true ] && echo 1 || echo 0)/" "$conf"
          grep -E '^(timeout|default|quiet|theme|accent|accent_variant)=' "$conf"

      - name: Build the recovery ZIPs
        # The runner is arm64, so its own gcc builds the static injector.
        run: |
          sudo apt-get install -yq zip
          CC=gcc tools/inject/make-zip.sh --esp out/esp deps/Mu-Silicium/Mu-piano.img \
            out/piano-uefi-${{ github.run_number }}.zip

      # Flash the ZIP in OrangeFox or TWRP; the -uninstall ZIP takes it out.
      - uses: actions/upload-artifact@v4
        with:
          name: piano-uefi-${{ github.run_number }}
          path: |
            out/piano-uefi-${{ github.run_number }}.zip
            out/piano-uefi-${{ github.run_number }}-uninstall.zip

      - uses: actions/upload-artifact@v4
        with:
          name: piano-uefi-${{ github.run_number }}-parts
          path: |
            deps/Mu-Silicium/Mu-piano.img
            out/selector.bin
            out/esp
